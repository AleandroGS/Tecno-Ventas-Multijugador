</style></head><body><div class="wrap"><header class="header"><div class="brand"><div class="brandmark">⚡</div><div>TECNO VENTAS <small>MULTIJUGADOR EN VIVO</small></div></div><div class="status"><span class="dot" id="dot"></span><span id="connection">Conectando…</span></div></header><main id="app"></main><footer class="foot">Juego educativo sobre <b>tecnología e innovación en las ventas</b> · Cada estudiante participa desde su dispositivo</footer></div><div id="toast" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KINDS={quiz:{emoji:'⚡',title:'Quiz relámpago',sub:'Responde rápido. Cada segundo cuenta.'},search:{emoji:'🔎',title:'Sopa de letras',sub:'Lee las pistas y encuentra cinco respuestas cortas.'},puzzle:{emoji:'🧩',title:'Rompecabezas de palabras',sub:'Ordena las piezas hasta descubrir el término.'},memory:{emoji:'🧠',title:'Memoria digital',sub:'Encuentra la palabra y su definición.'}};
let ws=null,state=null,connected=false,connectionDelay=900,clockOffset=0,reconnectHandle=null,lastRoundKey='',pickedMode='circuit',firstCell=null,dragStart=null,ignoreClickOnce=false,puzzleParts=[],memoryOpen=[],memoryBusy=false,landingName='',landingCode=new URLSearchParams(location.search).get('sala')||'';
function getSession(){try{return JSON.parse(sessionStorage.getItem('tv_live_session')||'null')}catch{return null}}
function putSession(value){sessionStorage.setItem('tv_live_session',JSON.stringify(value))}
function clearSession(){sessionStorage.removeItem('tv_live_session')}
function connect(){clearTimeout(reconnectHandle);const protocol=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${protocol}//${location.host}/ws`);connected=false;updateConn();
 ws.onopen=()=>{connected=true;connectionDelay=900;updateConn();const session=getSession();if(session)send({type:'resume',room:session.room,token:session.token});else render();};
 ws.onmessage=event=>{let m;try{m=JSON.parse(event.data)}catch{return}receive(m)};
 ws.onerror=()=>{};
 ws.onclose=()=>{connected=false;updateConn();connectionDelay=Math.min(10000,connectionDelay*1.55);reconnectHandle=setTimeout(connect,connectionDelay);};
}
function updateConn(){const dot=$('#dot'),c=$('#connection');if(!dot||!c)return;dot.className='dot'+(connected?' on':'');c.textContent=connected?'Conectado':'Reconectando…';}
function send(payload){if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify(payload));return true;}toast('Esperando conexión con la sala.','bad');return false;}
function toast(t,bad=false){const e=$('#toast');e.innerHTML=`<div class="overlaytoast ${bad?'bad':''}">${esc(t)}</div>`;clearTimeout(toast._id);toast._id=setTimeout(()=>e.innerHTML='',3100);}
function receive(m){
 if(m.type==='error'){toast(m.message,true);if(m.message.includes('sesión')||m.message.includes('sala ya no')){clearSession();state=null;render();}return;}
 if(m.type==='identity'){putSession({role:m.role,room:m.room,token:m.token,name:m.name||''});return;}
 if(m.type==='kicked'){clearSession();state=null;toast('El profesor te retiró de la sala.',true);render();return;}
 if(m.type==='sync'){
  const next=m.state;clockOffset=Date.now()-next.serverNow;
  const nextKey=next.round?`${next.room}-${next.roundNumber}-${next.round.kind}`:'';
  if(nextKey!==lastRoundKey){lastRoundKey=nextKey;firstCell=null;puzzleParts=[];memoryOpen=[];memoryBusy=false;window.scrollTo({top:0,behavior:'smooth'});}
  state=next;render();return;
 }
 if(m.type==='feedback'){
  if(m.bad){toast(m.bad,true);return;}
  if(m.correct){toast((m.points?'+'+m.points+' puntos · ':'')+(m.text||'¡Bien!'));
    if(state?.round?.kind==='puzzle')puzzleParts=[];
    if(state?.round?.kind==='memory'){memoryOpen=[];memoryBusy=false;}
  }else{
   toast(m.text||'Intenta de nuevo',state?.round?.kind!=='quiz');
   if(state?.round?.kind==='memory'){memoryBusy=true;setTimeout(()=>{memoryOpen=[];memoryBusy=false;render()},750);}
  }
  return;
 }
}
function entryView(){return `<section class="hero"><div class="eyebrow">🔴 COMPETENCIA EN TIEMPO REAL</div><h1>TECNO VENTAS.<br><span class="gradient">¡TODOS JUEGAN!</span></h1><p>Resuelve desafíos desde tu celular, compite con tus compañeros y descubre cómo la tecnología ha transformado las ventas.</p><div class="mini-pills"><span class="mini-pill">📱 Cada quien desde su dispositivo</span><span class="mini-pill">🔎 Sopas de letras</span><span class="mini-pill">🧩 Rompecabezas</span><span class="mini-pill">⚡ Preguntas rápidas</span></div></section>
 <div class="two-col"><section class="card entry"><div class="emoji">🎤</div><h2>Soy el profesor</h2><p>Abre una sala, comparte el código y dirige las pruebas en vivo.</p><button class="btn primary full" data-action="create" ${!connected?'disabled':''}>CREAR SALA GRATIS →</button><div class="hintline">La sala se mantiene abierta mientras el servidor esté disponible.</div></section><section class="card entry"><div class="emoji">📱</div><h2>Voy a jugar</h2><p>Entra con tu nombre y el código que comparte quien presenta.</p><label class="field">Tu nombre<input id="join-name" type="text" maxlength="22" placeholder="Ej.: Andrea" autocomplete="nickname" value="${esc(landingName)}"></label><label class="field">Código de seis caracteres<input id="join-code" type="text" maxlength="6" inputmode="text" autocapitalize="characters" placeholder="ABC123" value="${esc(landingCode)}"></label><button class="btn purple full" data-action="join" ${!connected?'disabled':''}>ENTRAR A LA SALA →</button></section></div><p class="hintline" style="text-align:center;margin-top:26px">Funciona con conexión a internet. No hay que instalar ninguna aplicación.</p>`;}
function roomLink(){return location.origin+location.pathname+'?sala='+encodeURIComponent(state.room);}
function playerItem(p,canKick=false){return `<div class="player ${p.online?'':'faded'}"><span class="avatar">${esc(p.name.slice(0,1).toUpperCase())}</span><span class="meta"><b>${esc(p.name)}</b><small>${p.online?'En línea':'Desconectado'}${p.completed?' · ¡Terminó!':''}</small></span><strong class="score">${p.score}</strong>${canKick?`<button class="btn tiny danger" data-action="kick" data-id="${p.id}" title="Retirar">×</button>`:''}</div>`}
function hostLobby(){const local=['localhost','127.0.0.1'].includes(location.hostname);const desc=local?'<div class="notice warning">Estás en modo de prueba local. Para que todos entren desde otros celulares, primero publica este proyecto en un servidor web.</div>':'';
 return `<div class="hud"><span class="overline">SALA DEL PROFESOR</span><span class="code-chip">${esc(state.room)}</span></div><div class="room-layout"><section class="card panel"><div class="overline">1 · Comparte tu código</div><h1 class="section-title">¡Que entren tus jugadores!</h1><p class="muted">Cada estudiante abre la misma página, escribe su nombre y coloca este código.</p><div class="share"><b>Código: <span style="color:var(--teal);letter-spacing:.15em">${esc(state.room)}</span></b><div class="room-link">${esc(roomLink())}</div><div class="row"><button class="btn primary tiny" data-action="copylink">Copiar enlace</button><button class="btn secondary tiny" data-action="copycode">Copiar código</button></div></div>${desc}<div class="divider"></div><div class="overline">2 · Escoge la competencia</div><div class="mode-grid">${[
 ['circuit','🏆','Gran circuito','Las cuatro pruebas y rondas de quiz'],['quiz','⚡','Quiz relámpago','6 preguntas con límite de tiempo'],['search','🔎','Sopa de letras','2 tableros con pistas'],['puzzle','🧩','Rompecabezas','2 juegos para ordenar respuestas'],['memory','🧠','Memoria digital','2 juegos de parejas']].map(([id,emoji,title,info])=>`<button class="mode ${pickedMode===id?'active':''}" data-action="mode" data-mode="${id}">${emoji} <strong>${title}</strong><small>${info}</small></button>`).join('')}</div><button class="btn primary full" data-action="start" ${!state.players.length?'disabled':''}>EMPEZAR CON ${state.players.length} PARTICIPANTE${state.players.length===1?'':'S'} →</button><div class="hintline">Se admiten hasta 80 participantes. Puedes iniciar el juego cuando quieras.</div></section>
 <aside class="card panel"><div class="toprow"><div><div class="overline">Sala de espera</div><h2 style="margin:5px 0">${state.players.length} participantes</h2></div><span class="tag">EN VIVO</span></div><div class="players">${state.players.length?state.players.map(p=>playerItem(p,true)).join(''):'<div class="empty-state">Todavía no ha entrado nadie.<p class="small">Comparte el código y aparecerán aquí automáticamente.</p></div>'}</div></aside></div>`;
}
function playerWaiting(){return `<section class="card wait"><div class="big-emoji pulse">🎮</div><div class="overline" style="margin-top:20px">Ya estás dentro de la sala ${esc(state.room)}</div><h1 class="section-title">¡Prepárate para jugar!</h1><p class="muted">El profesor está preparando el reto. La partida empezará automáticamente en tu pantalla.</p>${!state.hostOnline?'<div class="notice warning">Esperando a que el profesor se reconecte.</div>':''}<div class="stat-grid"><div class="stat"><b>${state.players.length}</b><small>Jugadores</small></div><div class="stat"><b>4</b><small>Tipos de juego</small></div><div class="stat"><b>1</b><small>Gran reto</small></div></div><div class="row" style="justify-content:center"><span class="tag">Tu nombre: ${esc(selfName())}</span><span class="tag">Sala ${esc(state.room)}</span></div></section>`;}
function selfName(){return state.players.find(x=>x.id===state.playerId)?.name||'Participante'}
function timerHeader(){const r=state.round,k=KINDS[r.kind],duration=remaining();return `<div class="game-head"><div class="row"><div><div class="overline">Ronda ${state.roundNumber} de ${state.totalRounds} · Sala ${esc(state.room)}</div><h1>${k.emoji} ${k.title}</h1><div class="small muted">${esc(k.sub)}</div></div><div class="timer ${duration<12?'warn':''}" id="clock">${Math.ceil(duration)} s</div></div><div class="bar"><div class="fill" id="clockbar" style="width:${100*duration/r.seconds}%"></div></div></div>`;}
function remaining(){if(!state||state.phase!=='playing'||!state.round)return 0;return Math.max(0,(state.round.endsAt-(Date.now()-clockOffset))/1000)}
function renderQuiz(){const r=state.round,selected=state.me.selected;return `<div class="overline">¿Cuánto sabes de ventas digitales?</div><h2 class="question">${esc(r.question)}</h2><div class="options">${r.options.map((o,i)=>`<button class="option ${selected===i?'chosen':''}" data-action="quiz" data-answer="${i}" ${state.me.answered?'disabled':''}><i>${'ABCD'[i]}</i><span>${esc(o)}</span></button>`).join('')}</div>${state.me.answered?'<div class="notice">Respuesta enviada. Espera a que termine el tiempo o respondan tus compañeros.</div>':'<p class="hintline">Cada respuesta correcta suma más puntos cuanto más rápido respondas.</p>'}`;}
function renderSearch(){const r=state.round,found=new Set(state.me.found),indices=new Set(state.me.matchedIndices);return `<div class="overline">Desliza el dedo o toca la primera y última letra</div><div class="word-search-layout"><div><div class="wordgrid" id="wordgrid">${r.board.map((line,y)=>[...line].map((letter,x)=>`<button class="cell ${indices.has(y*12+x)?'found':''} ${firstCell&&firstCell[0]===y&&firstCell[1]===x?'pick':''}" data-cell="${y},${x}" aria-label="Fila ${y+1} columna ${x+1}: ${letter}">${letter}</button>`).join('')).join('')}</div><p class="hintline">Puedes seleccionar palabras en horizontal, vertical o diagonal, incluso al revés.</p></div><div><div class="overline">Resuelve las pistas · ${found.size}/${r.clues.length}</div><div class="clues">${r.clues.map(w=>`<div class="clue ${found.has(w.word)?'found':''}"><div class="check">${found.has(w.word)?'✓':'🔍'}</div><div><b>${found.has(w.word)?esc(w.word):'＿'.repeat(w.length)}</b><div>${esc(w.hint)}</div></div></div>`).join('')}</div></div></div>`;}
function currentPuzzle(){return state.round.puzzles.findIndex((_,i)=>!state.me.solved.includes(i))}
function renderPuzzle(){const r=state.round,ix=currentPuzzle();if(ix===-1)return `<div class="teacher-view"><div><div class="big-emoji">🏆</div><h2>¡Resolviste todos los rompecabezas!</h2><p>Espera a que termine la ronda y descubre tu posición.</p></div></div>`;
 const p=r.puzzles[ix],used=new Set(puzzleParts);return `<div class="overline">Palabra ${ix+1} de ${r.puzzles.length}</div><h2 class="puzzle-hint">${esc(p.hint)}</h2><p class="muted small">Toca las piezas en el orden correcto.</p><div class="answerzone">${puzzleParts.length?puzzleParts.map(id=>`<span class="inanswer">${esc(p.parts[id])}</span>`).join(''):'<span>Tu respuesta aparecerá aquí…</span>'}</div><div class="tiles">${p.parts.map((x,i)=>`<button class="tile ${used.has(i)?'used':''}" data-action="piece" data-piece="${i}" ${used.has(i)?'disabled':''}>${esc(x)}</button>`).join('')}</div><div class="row"><button class="btn primary" data-action="solve" ${puzzleParts.length!==p.parts.length?'disabled':''}>COMPROBAR RESPUESTA</button><button class="btn secondary" data-action="undo" ${!puzzleParts.length?'disabled':''}>Deshacer</button><button class="btn secondary" data-action="clearparts" ${!puzzleParts.length?'disabled':''}>Reiniciar</button></div><p class="hintline">Puntos extra por resolver todas las pistas antes de que se agote el tiempo.</p>`;}
function renderMemory(){const r=state.round,matched=new Set(state.me.matchedIndices);return `<div class="overline">Encuentra las parejas · ${state.me.matched.length}/5</div><h2 class="question" style="font-size:22px">Relaciona cada concepto con su significado</h2><div class="memory-grid">${r.cards.map((c,i)=>{const revealed=matched.has(i)||memoryOpen.includes(i);return `<button class="memory-card ${matched.has(i)?'matched':revealed?'':'back'}" data-action="flip" data-card="${i}" ${matched.has(i)||memoryBusy?'disabled':''}>${revealed?esc(c.text):'✦'}</button>`}).join('')}</div><p class="hintline">Toca dos cartas. Si forman la pareja correcta, se quedan descubiertas.</p>`;}
function teacherStage(){const r=state.round;return `<div class="teacher-view"><div><div class="big-emoji">${KINDS[r.kind].emoji}</div><h2>${r.kind==='quiz'?esc(r.question):esc(KINDS[r.kind].title)}</h2><p>${KINDS[r.kind].sub} Los estudiantes están jugando simultáneamente en sus dispositivos.</p><div class="mini-pills"><span class="mini-pill">👥 ${state.players.length} participantes</span><span class="mini-pill">✅ ${state.players.filter(x=>x.completed).length} terminaron</span></div></div></div>`;}
function inGame(){const isHost=state.role==='host';let game=isHost?teacherStage():state.round.kind==='quiz'?renderQuiz():state.round.kind==='search'?renderSearch():state.round.kind==='puzzle'?renderPuzzle():renderMemory();
 return `<div class="toprow"><span class="overline">${isHost?'🎤 Panel del profesor':'📱 Estás jugando como '+esc(selfName())}</span><span class="tag">${isHost?'CONTROL DE SALA':'PUNTOS: '+state.players.find(x=>x.id===state.playerId)?.score}</span></div>${timerHeader()}<div class="game-layout"><section class="card panel">${game}${isHost?`<div class="divider"></div><div class="row"><button class="btn secondary" data-action="end">TERMINAR RONDA Y VER RESULTADOS →</button></div>`:''}</section><aside class="card panel"><div class="overline">${isHost?'Marcador en vivo':'Tabla de posiciones'}</div><h2 style="margin:6px 0 5px">🏆 Clasificación</h2><p class="small muted">Puntuación acumulada de todas las pruebas.</p><div class="rank-list">${state.players.slice(0,12).map((p,i)=>`<div class="rank-line ${p.id===state.playerId?'self':''}"><span class="num">${i+1}.</span><span class="who">${esc(p.name)} ${p.online?'':'· ⭘'}</span><span class="points">${p.score}</span></div>`).join('')}</div>${state.players.length>12?`<p class="hintline">Y ${state.players.length-12} participantes más.</p>`:''}${!state.hostOnline?'<div class="notice warning">Profesor desconectado. La ronda actual continúa; necesitará regresar para iniciar la siguiente.</div>':''}<div class="divider"></div><div class="small muted">${isHost?'Al finalizar el tiempo, los resultados aparecen solos. También puedes terminar esta ronda antes.':'Cuando acabe el tiempo, el profesor podrá iniciar la siguiente prueba.'}</div></aside></div>`;}
function resultView(){const isHost=state.role==='host',r=state.round,k=KINDS[r.kind];const winners=state.players.slice(0,3),isFinal=state.phase==='final',finalReady=isFinal;
 return `<div class="results"><div class="card panel"><div class="overline">${isFinal?'🎊 FIN DEL CAMPEONATO':`RONDA ${state.roundNumber} DE ${state.totalRounds} COMPLETADA`}</div><h1 class="section-title">${isFinal?'🏆 ¡Tenemos ganadores!':`${k.emoji} ¡Ronda terminada!`}</h1><p class="muted">${isFinal?'Así quedó la clasificación total de TECNO VENTAS.':'Mira quién ganó más puntos y prepárate para la siguiente prueba.'}</p>${r.kind==='quiz'?`<div class="notice">Respuesta correcta: <b>${esc(r.options[r.correct])}</b>. ${esc(r.explanation)}</div>`:''}${r.kind==='search'?`<div class="notice">Las palabras ocultas eran: <b>${esc(r.clues.map(x=>x.word).join(' · '))}</b>.</div>`:''}${r.kind==='puzzle'?`<div class="notice">Respuestas: <b>${esc(r.puzzles.map(x=>x.answer).join(' · '))}</b>.</div>`:''}${r.kind==='memory'&&r.pairs?`<div class="notice"><b>Parejas correctas:</b> ${r.pairs.map(x=>`<div>${esc(x.term)}: ${esc(x.definition)}</div>`).join('')}</div>`:''}
 <div class="podium">${winners.map((p,i)=>`<div class="card"><div class="medal">${['🥇','🥈','🥉'][i]}</div><strong>${esc(p.name)}</strong><div class="score">${p.score} pts</div></div>`).join('')}</div><h2>Tabla general</h2><div class="rank-list">${state.players.map((p,i)=>`<div class="rank-line ${p.id===state.playerId?'self':''}"><span class="num">${i+1}º</span><span class="who">${esc(p.name)}</span><span class="points">${p.score} pts</span></div>`).join('')}</div>${isHost?`<div class="row" style="margin-top:20px"><button class="btn primary" data-action="${isFinal?'lobby':'next'}">${isFinal?'ORGANIZAR OTRA PARTIDA':state.roundNumber===state.totalRounds?'VER CAMPEÓN FINAL':'SIGUIENTE PRUEBA →'}</button><button class="btn secondary" data-action="export">Descargar resultados CSV</button></div>`:`<div class="notice" style="margin-top:22px">${isFinal?'¡Gracias por participar!':'El profesor iniciará la siguiente prueba. No cierres esta página.'}</div>`}</div></div>`;
}
function render(){const app=$('#app');if(!app)return;if(!state){app.innerHTML=entryView();return}if(state.phase==='lobby'){app.innerHTML=state.role==='host'?hostLobby():playerWaiting();return}if(state.phase==='playing'){app.innerHTML=inGame();return}app.innerHTML=resultView();}
function clickCell(y,x){if(!state||state.phase!=='playing'||state.role!=='player'||state.round.kind!=='search')return;
 if(!firstCell){firstCell=[y,x];render();return;}
 const start=firstCell;firstCell=null;if(start[0]===y&&start[1]===x){render();return;}
 send({type:'answer',kind:'search',start,end:[y,x]});render();}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Copiado al portapapeles.')}catch{window.prompt('Copia este texto:',text)}}
function exportResults(){if(!state)return;const escapeCsv=s=>'"'+String(s).replace(/"/g,'""')+'"';const data=['Posición;Nombre;Puntos',...state.players.map((p,i)=>`${i+1};${escapeCsv(p.name)};${p.score}`)].join('\n');const a=document.createElement('a');const url=URL.createObjectURL(new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=`TECNO_VENTAS_${state.room}_resultados.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function handleClick(e){const cell=e.target.closest('[data-cell]');if(cell){if(ignoreClickOnce){ignoreClickOnce=false;return;}const [y,x]=cell.dataset.cell.split(',').map(Number);clickCell(y,x);return;}
 const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
 if(action==='create'){send({type:'create'});return;}
 if(action==='join'){const name=$('#join-name')?.value.trim(),room=$('#join-code')?.value.trim().toUpperCase();landingName=name;landingCode=room;if(!name||!room||room.length!==6){toast('Escribe tu nombre y el código de seis caracteres.',true);return;}send({type:'join',room,name});return;}
 if(action==='copycode'){copyText(state.room);return;}if(action==='copylink'){copyText(roomLink());return;}
 if(action==='mode'){pickedMode=el.dataset.mode;render();return;}if(action==='start'){send({type:'start',mode:pickedMode});return;}
 if(action==='end'){send({type:'end'});return;}if(action==='next'){send({type:'next'});return;}if(action==='lobby'){send({type:'lobby'});return;}
 if(action==='kick'){send({type:'kick',pid:el.dataset.id});return;}if(action==='export'){exportResults();return;}
 if(action==='quiz'){send({type:'answer',kind:'quiz',answer:Number(el.dataset.answer)});return;}
 if(action==='piece'){const ix=Number(el.dataset.piece);if(!puzzleParts.includes(ix))puzzleParts.push(ix);render();return;}
 if(action==='undo'){puzzleParts.pop();render();return;}if(action==='clearparts'){puzzleParts=[];render();return;}
 if(action==='solve'){const index=currentPuzzle();if(index<0)return;const word=puzzleParts.map(i=>state.round.puzzles[index].parts[i]).join('');send({type:'answer',kind:'puzzle',index,answer:word});return;}
 if(action==='flip'){
  const ix=Number(el.dataset.card);if(memoryBusy||memoryOpen.includes(ix)||state.me.matchedIndices.includes(ix))return;
  memoryOpen.push(ix);render();if(memoryOpen.length===2){memoryBusy=true;send({type:'answer',kind:'memory',a:memoryOpen[0],b:memoryOpen[1]});}return;
 }
}
document.addEventListener('click',handleClick);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!state&&['join-name','join-code'].includes(e.target.id)){$('[data-action="join"]')?.click();}});
document.addEventListener('pointerdown',e=>{const cell=e.target.closest('[data-cell]');if(cell)dragStart={value:cell.dataset.cell,x:e.clientX,y:e.clientY};});
document.addEventListener('pointerup',e=>{
 if(!dragStart)return;
 const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-cell]');
 if(target&&target.dataset.cell!==dragStart.value){const [y,x]=dragStart.value.split(',').map(Number),[yy,xx]=target.dataset.cell.split(',').map(Number);firstCell=[y,x];clickCell(yy,xx);ignoreClickOnce=true;}
 dragStart=null;
});
setInterval(()=>{if(!state||state.phase!=='playing'||!state.round)return;const t=remaining(),clock=$('#clock'),bar=$('#clockbar');if(clock){clock.textContent=Math.ceil(t)+' s';clock.classList.toggle('warn',t<12);}if(bar)bar.style.width=(100*t/state.round.seconds)+'%';},180);
// Mantiene activa la sala mientras haya participantes conectados. En alojamientos
// gratuitos el tráfico entrante por WebSocket ayuda a evitar la suspensión por inactividad.
setInterval(()=>{if(connected&&state)send({type:'ping'});},25000);
connect();render();
</script></body></html>
